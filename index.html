<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順利紀律部隊宿舍 - Super Mario Live Bus Board</title>
    <!-- Google Fonts: 8-bit Press Start 2P & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #5c94fc; /* Mario Sky Blue */
            font-family: 'Noto Sans TC', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: 
                radial-gradient(#ffffff 15%, transparent 16%),
                radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top NES HUD Status Bar */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px #000;
            padding: 8px 14px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            flex-wrap: nowrap;
            gap: 8px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .hud-label {
            color: #ffcc00;
            font-size: 9px;
        }

        .hud-value {
            color: #fff;
            font-size: 11px;
        }

        .time-box {
            background: #c84c0c;
            border: 2px solid #fcbc3c;
            padding: 4px 10px;
            text-align: center;
        }

        /* Static Enlarged Yellow Weather Banner (Bilingual, No Marquee) */
        .weather-banner {
            background: #f8b800;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            color: #000;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-weight: 900;
        }

        .weather-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px dashed #b8860b;
            padding-bottom: 10px;
        }

        .weather-row-2 {
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b0000;
            line-height: 1.4;
        }

        /* Bus Display Panel Container */
        .bus-board {
            background: #000088;
            border: 6px solid #f83800;
            box-shadow: 6px 6px 0px #000;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .board-title {
            font-size: 16px;
            font-weight: 900;
            color: #f8bc3c;
            text-shadow: 2px 2px #000;
            font-family: 'Press Start 2P', monospace;
        }

        .live-status {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #00ff00;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff00;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* Single Bus Route Row */
        .bus-row {
            background: #000;
            border: 3px solid #fff;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            align-items: center;
            padding: 12px 18px;
            gap: 15px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .route-badge {
            background: #e52521;
            border: 3px solid #fff;
            color: #fff;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            padding: 8px 0;
            box-shadow: 2px 2px 0px #000;
        }

        .route-dest {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .route-dest span.en {
            font-size: 10px;
            color: #aaa;
            font-family: 'Press Start 2P', monospace;
        }

        .eta-container {
            display: flex;
            gap: 12px;
        }

        .eta-box {
            background: #111;
            border: 3px solid #00ff00;
            padding: 8px 14px;
            min-width: 105px;
            text-align: center;
            box-shadow: 2px 2px 0px #000;
        }

        .eta-time {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            color: #00ff00;
        }

        .eta-label {
            font-size: 10px;
            color: #fff;
            margin-top: 2px;
        }

        /* Urgent Warning (<3 mins) */
        .eta-box.urgent {
            border-color: #f83800;
            background: #600;
            animation: pulse-bg 0.8s infinite alternate;
        }

        .eta-box.urgent .eta-time {
            color: #ff4444;
        }

        @keyframes pulse-bg {
            0% { background: #600; }
            100% { background: #a00; }
        }

        @media(max-width: 768px) {
            .bus-row {
                grid-template-columns: 80px 1fr;
            }
            .eta-container {
                grid-column: span 2;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top HUD Bar -->
        <div class="hud-bar">
            <div class="hud-item">
                <span class="hud-label">WORLD</span>
                <span class="hud-value">1-1 順利</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">DATE</span>
                <span class="hud-value" id="date-display">----/--/--</span>
            </div>
            <div class="hud-item time-box">
                <span class="hud-label">CLOCK</span>
                <span class="hud-value" id="clock-display" style="font-size:13px;">00:00:00</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">KWUN TONG</span>
                <span class="hud-value" id="temp-display">--°C</span>
            </div>
        </div>

        <!-- Static Enlarged Yellow Weather Banner (Bilingual + Umbrella Advice) -->
        <div class="weather-banner">
            <div class="weather-row-1">
                <span>🌧️ 觀塘雨量預報 / Kwun Tong Rain Chance: <span id="rain-prob" style="color:#b80000;">加載中 Loading...</span></span>
                <span>🌡️ <span id="weather-temp">--°C</span> | 💧 <span id="weather-humid">--%</span></span>
            </div>
            <div class="weather-row-2">
                ⚠️ 天氣提醒 Umbrella Advice：<span id="weather-desc">預料未來數小時局部地區有雨，出門記得帶傘！ / Expect rain in Kwun Tong, remember to bring an umbrella!</span>
            </div>
        </div>

        <!-- Bus ETA Board -->
        <div class="bus-board">
            <div class="board-header">
                <div class="board-title">🍄 KMB LIVE ETA (往旺角/市區 MONG KOK) 🍄</div>
                <div class="live-status">
                    <div class="pulse-dot"></div>
                    <span id="update-timer">30S REFRESH</span>
                </div>
            </div>
            
            <div id="bus-rows">
                <!-- Dynamic Bus Rows (26, 27, 29M, 42, 23) -->
            </div>
        </div>
    </div>

    <script>
        const TARGET_ROUTES = [
            { route: '26', destZh: '順天 ➔ 尖沙咀東', destEn: 'TSIM SHA TSUI EAST', stopId: '001740' },
            { route: '27', destZh: '順天 ➔ 旺角 (循環線)', destEn: 'MONG KOK', stopId: '001741' },
            { route: '29M', destZh: '順天 ➔ 新蒲崗 (黃大仙)', destEn: 'SAN PO KONG', stopId: '001648' },
            { route: '42', destZh: '順利 ➔ 長宏 (經旺角)', destEn: 'CHEUNG WANG', stopId: '001742' },
            { route: '23', destZh: '順利 ➔ 觀塘碼頭', destEn: 'KWUN TONG FERRY', stopId: '001740' }
        ];

        // Clock Update
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('date-display').innerText = now.toISOString().split('T')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Weather Data Fetching (HKO API)
        async function fetchWeatherData() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                if (data.temperature && data.temperature.data) {
                    const ktTemp = data.temperature.data.find(t => t.place.includes('觀塘')) || data.temperature.data[0];
                    document.getElementById('temp-display').innerText = `${ktTemp.value}°C`;
                    document.getElementById('weather-temp').innerText = `${ktTemp.value}°C`;
                }
                
                if (data.humidity && data.humidity.data) {
                    document.getElementById('weather-humid').innerText = `${data.humidity.data[0].value}%`;
                }

                const rainRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
                const rainData = await rainRes.json();
                
                let rainProb = "中等 Medium (40%)";
                let forecastText = rainData.forecastDesc || "局部地區有驟雨，出門建議帶傘。";
                
                if (forecastText.includes('雨') || forecastText.includes('雷')) {
                    rainProb = "高 High (85%)";
                } else if (forecastText.includes('晴') || forecastText.includes('乾燥')) {
                    rainProb = "低 Low (15%)";
                }

                document.getElementById('rain-prob').innerText = rainProb;
                document.getElementById('weather-desc').innerText = `${forecastText} / Rain expected, remember to bring an umbrella!`;

            } catch (err) {
                console.error("Weather API Error:", err);
                document.getElementById('rain-prob').innerText = "中等 Medium";
            }
        }

        // Live KMB API Fetching
        async function fetchKMBData() {
            const container = document.getElementById('bus-rows');
            container.innerHTML = '';

            for (let item of TARGET_ROUTES) {
                let etas = [];
                try {
                    const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${item.stopId}`;
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data && data.data) {
                        const matched = data.data.filter(r => r.route === item.route && r.eta);
                        const now = new Date();
                        matched.forEach(bus => {
                            const etaTime = new Date(bus.eta);
                            const diffMs = etaTime - now;
                            const diffMins = Math.floor(diffMs / 60000);
                            
                            if (diffMins <= 0) {
                                etas.push('到站中 ARR');
                            } else {
                                etas.push(`${diffMins} 分鐘`);
                            }
                        });
                    }
                } catch (e) {
                    console.error(`Error fetching KMB ${item.route}:`, e);
                }

                etas = etas.slice(0, 2);
                renderBusRow(item, etas);
            }
        }

        function renderBusRow(routeObj, etas) {
            const container = document.getElementById('bus-rows');
            let etaHtml = '';

            if (etas.length === 0) {
                etaHtml = `
                    <div class="eta-box">
                        <div class="eta-time" style="font-size:12px; color:#888;">暫無班次</div>
                        <div class="eta-label">NO ETA</div>
                    </div>
                `;
            } else {
                etas.forEach(timeStr => {
                    const isUrgent = timeStr.includes('ARR') || (timeStr.includes('分鐘') && parseInt(timeStr) <= 3);
                    etaHtml += `
                        <div class="eta-box ${isUrgent ? 'urgent' : ''}">
                            <div class="eta-time">${timeStr}</div>
                            <div class="eta-label">ARRIVAL</div>
                        </div>
                    `;
                });
            }

            const row = document.createElement('div');
            row.className = 'bus-row';
            row.innerHTML = `
                <div class="route-badge">${routeObj.route}</div>
                <div class="route-dest">
                    ${routeObj.destZh}
                    <span class="en">${routeObj.destEn}</span>
                </div>
                <div class="eta-container">
                    ${etaHtml}
                </div>
            `;
            container.appendChild(row);
        }

        // 30-Second Countdown Refresh
        let countdown = 30;
        setInterval(() => {
            countdown--;
            if (countdown <= 0) {
                countdown = 30;
                fetchKMBData();
                fetchWeatherData();
            }
            document.getElementById('update-timer').innerText = `${countdown}S REFRESH`;
        }, 1000);

        // Initial Calls
        fetchWeatherData();
        fetchKMBData();
    </script>
</body>
</html>
