<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順利紀律部隊宿舍 - 巴士及天氣看板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['"SF Mono"', 'Consolas', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#0a0a0c] text-gray-100 h-screen w-screen overflow-hidden flex flex-col justify-between p-2 sm:p-3 selection:bg-blue-500 selection:text-white">

    <!-- Header (連同即時時鐘) -->
    <header class="w-full bg-[#141418] border border-gray-800 px-4 py-2.5 flex justify-between items-center shadow-lg rounded-xl shrink-0">
        <div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="connection-dot"></span>
                <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">順利紀律部隊宿舍 <span class="text-xs text-gray-400 font-normal">Shun Lee Quarters</span></h1>
            </div>
            <p class="text-[10px] text-gray-400">Stop ID: 30B726B18D6F2553</p>
        </div>
        <div class="text-right">
            <div id="clock-time" class="text-xl sm:text-2xl font-mono font-black text-white tracking-wider">00:00:00</div>
            <div id="clock-date" class="text-[10px] text-gray-400">----/--/-- ---</div>
        </div>
    </header>

    <!-- Weather Info Section (放高少少，置於巴士線上方) -->
    <footer class="w-full bg-[#141418] border border-gray-800 px-4 py-2 rounded-xl shadow-lg shrink-0 text-xs text-gray-300 space-y-1">
        <div class="flex justify-between items-center font-bold text-cyan-400 border-b border-gray-800 pb-1">
            <span>天文台即時天氣 & 觀塘區預報 <span class="text-[10px] font-normal text-gray-400">HKO Weather & Rain Forecast</span></span>
            <span id="weather-time" class="text-[10px] text-gray-400 font-normal">--:--</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-0.5">
            <div>Temp (氣溫): <span id="wx-temp" class="font-bold text-white">--</span>°C</div>
            <div>Humidity (濕度): <span id="wx-rh" class="font-bold text-white">--%</span></div>
            <div>UV Index (紫外線): <span id="wx-uv" class="font-bold text-white">--</span></div>
            <div class="truncate">Weather: <span id="wx-icon-text" class="font-bold text-white">載入中...</span></div>
        </div>
        <div class="border-t border-gray-800/60 pt-1 flex flex-col sm:flex-row justify-between gap-1 text-[11px]">
            <div>
                <span class="text-yellow-400 font-bold">🌧 降雨預報 (Rain Forecast):</span> 
                <span id="wx-rain-forecast" class="text-gray-200">正在分析天文台數據...</span>
            </div>
            <div class="text-amber-300 truncate">
                <span class="font-bold">⚠️</span> <span id="wx-warning">無天氣警告</span>
            </div>
        </div>
    </footer>

    <!-- Main Content: Bus Routes (每一條線變返一行) -->
    <main class="w-full max-w-7xl mx-auto my-1 flex flex-col justify-around flex-1 space-y-1.5" id="bus-main-container">
        <!-- 路線列表透過 JS 動態載入 -->
    </main>

    <!-- JavaScript 邏輯 -->
    <script>
        const STOP_ID = "30B726B18D6F2553";
        const ROUTES = ["26", "27", "29M", "42", "23"];

        const ROUTE_COLORS = {
            "26": "bg-amber-500/20 text-amber-400 border-amber-500/40",
            "27": "bg-blue-500/20 text-blue-400 border-blue-500/40",
            "29M": "bg-emerald-500/20 text-emerald-400 border-emerald-500/40",
            "42": "bg-purple-500/20 text-purple-400 border-purple-500/40",
            "23": "bg-rose-500/20 text-rose-400 border-rose-500/40"
        };

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayName = days[now.getDay()];

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('clock-date').textContent = `${year}/${month}/${date} (${dayName})`;
            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function initCards() {
            const mainContainer = document.getElementById('bus-main-container');
            mainContainer.innerHTML = '';
            ROUTES.forEach(route => {
                const colorClass = ROUTE_COLORS[route] || "bg-gray-800 text-gray-300 border-gray-700";
                const div = document.createElement('div');
                div.className = "bg-[#141418] border border-gray-800/80 rounded-xl px-4 py-2.5 shadow-md flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="px-3 py-0.5 rounded-lg font-black text-base sm:text-lg border ${colorClass} shrink-0">
                            ${route}
                        </span>
                        <span id="dest-${route}" class="text-xs sm:text-sm text-gray-300 truncate">往指定方向</span>
                    </div>
                    <div class="flex items-center gap-3 shrink-0" id="etas-${route}">
                        <span class="text-gray-500 text-xs">載入中...</span>
                    </div>
                `;
                mainContainer.appendChild(div);
            });
        }

        async function fetchETAs() {
            const dotEl = document.getElementById('connection-dot');
            try {
                const response = await fetch(`https://etabus.data.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}`);
                if (!response.ok) throw new Error('網絡連線錯誤');
                
                const data = await response.json();
                const etaList = data.data || [];

                ROUTES.forEach(route => {
                    const container = document.getElementById(`etas-${route}`);
                    const destEl = document.getElementById(`dest-${route}`);
                    if (!container || !destEl) return;

                    const routeEtas = etaList.filter(item => item.route === route);

                    if (routeEtas.length === 0) {
                        destEl.textContent = "往 暫無班次";
                        container.innerHTML = `<span class="text-gray-500 text-xs font-mono">HOLD</span>`;
                        return;
                    }

                    destEl.textContent = `往 ${routeEtas[0].dest_tc || ''}`;

                    let html = '';
                    routeEtas.slice(0, 2).forEach((item) => {
                        let timeStr = "即將到達";
                        let isUrgent = false;

                        if (item.eta) {
                            const etaTime = new Date(item.eta);
                            const now = new Date();
                            const diffMinutes = Math.round((etaTime - now) / 60000);

                            if (diffMinutes <= 1) {
                                timeStr = "剛剛到";
                                isUrgent = true;
                            } else if (diffMinutes <= 3) {
                                timeStr = `${diffMinutes}m`;
                                isUrgent = true;
                            } else {
                                timeStr = `${diffMinutes}m`;
                            }
                        } else if (item.rmk_tc) {
                            timeStr = item.rmk_tc;
                        }
                        
                        html += `
                            <span class="font-mono font-bold text-sm sm:text-base px-2 py-0.5 rounded bg-[#1a1a20] border border-gray-800 ${isUrgent ? 'text-[#ff453a] animate-pulse-fast' : 'text-cyan-300'}">
                                ${timeStr}
                            </span>
                        `;
                    });
                    container.innerHTML = html;
                });
                if(dotEl) dotEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500";
            } catch (error) {
                console.error(error);
                if(dotEl) dotEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-red-500";
            }
        }

        async function fetchWeather() {
            try {
                const resRpt = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                if (resRpt.ok) {
                    const data = await resRpt.json();
                    
                    if (data.temperature && data.temperature.data.length > 0) {
                        const kwunTong = data.temperature.data.find(t => t.place === '觀塘') || data.temperature.data[0];
                        document.getElementById('wx-temp').textContent = kwunTong.value;
                    }

                    if (data.humidity && data.humidity.data.length > 0) {
                        document.getElementById('wx-rh').textContent = `${data.humidity.data[0].value}%`;
                    }

                    if (data.uvindex && data.uvindex.data.length > 0) {
                        document.getElementById('wx-uv').textContent = data.uvindex.data[0].value;
                    } else {
                        document.getElementById('wx-uv').textContent = '0';
                    }

                    if (data.warningMessage && data.warningMessage.length > 0) {
                        document.getElementById('wx-warning').textContent = data.warningMessage.join(' | ');
                    } else {
                        document.getElementById('wx-warning').textContent = 'No Warning (無警告)';
                    }

                    const now = new Date();
                    document.getElementById('weather-time').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                }

                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                if (resFnd.ok) {
                    const fndData = await resFnd.json();
                    if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                        const todayFc = fndData.weatherForecast[0];
                        const psr = todayFc.PSR || '中';
                        const forecastText = todayFc.forecastWeather || '';
                        
                        let rainDesc = `Rain Prob (降雨概率): ${psr}`;
                        if (forecastText.includes('雨') || forecastText.includes('陣雨') || forecastText.includes('雷')) {
                            rainDesc += ` (有雨 / Rain Expected)`;
                        } else {
                            rainDesc += ` (無明顯雨 / Dry)`;
                        }
                        document.getElementById('wx-rain-forecast').textContent = rainDesc;
                        document.getElementById('wx-icon-text').textContent = todayFc.forecastForecast || forecastText;
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('wx-rain-forecast').textContent = "無法取得預報";
            }
        }

        initCards();
        fetchETAs();
        fetchWeather();

        setInterval(fetchETAs, 30000);
        setInterval(fetchWeather, 300000);
    </script>
</body>
</html>
