<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK BUS & WEATHER STATION HUB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"VT323"', 'monospace'],
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .animate-blink { animation: blink 1s infinite; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-2 selection:bg-red-600">

    <div class="w-full flex-1 flex flex-col border-4 border-gray-800 shadow-2xl overflow-hidden rounded-lg">
        
        <!-- Section 1: Header (Red Header Block) -->
        <header class="bg-[#cc0000] text-white p-3 border-b-4 border-gray-900 text-center select-none">
            <div class="text-xs font-bold tracking-widest text-yellow-300 uppercase">HK BUS STATION HUB</div>
            <div id="clock-date" class="text-xl font-bold tracking-wider mt-0.5 text-white">----/--/-- ---</div>
            <div id="clock-time" class="text-5xl sm:text-6xl font-black tracking-widest my-1 text-white leading-none">00:00:00</div>
            <div class="text-xs tracking-widest text-red-200">順利紀律部隊宿舍 (SHUN LEE QUARTERS)</div>
        </header>

        <!-- Section 2: Bus Arrival Times (Black Matrix Style) - Fit Width & Height -->
        <main class="bg-black p-4 flex-1 space-y-3 border-b-4 border-gray-900 flex flex-col justify-around" id="bus-container">
            <!-- 巴士卡片透過 JavaScript 自動動態生成 -->
        </main>

        <!-- Section 3: Observatory Weather Info (Blue Block) -->
        <footer class="bg-[#0044cc] text-white p-3 space-y-2 text-sm">
            <div class="text-xs font-bold text-cyan-200 tracking-wider flex justify-between items-center">
                <span>HKO REAL-TIME SYSTEM</span>
                <span id="weather-time" class="text-[10px] text-blue-200">--:--</span>
            </div>

            <!-- Temperature & Weather Icon -->
            <div class="flex justify-between items-center my-1">
                <div class="flex items-baseline gap-1">
                    <span id="wx-temp" class="text-4xl font-black text-white leading-none">--</span>
                    <span class="text-xl text-cyan-200 font-bold">°C</span>
                </div>
                <div id="wx-icon-text" class="text-right text-xs text-cyan-100 font-bold max-w-[200px]">
                    載入天氣中...
                </div>
            </div>

            <!-- Humidity & UV -->
            <div class="grid grid-cols-2 gap-2 text-xs border-t border-blue-600/60 pt-1.5 text-cyan-100">
                <div>Humidity: <span id="wx-rh" class="font-bold text-white">--%</span></div>
                <div>UV Index: <span id="wx-uv" class="font-bold text-white">--</span></div>
            </div>

            <!-- Rain Prediction & Warnings -->
            <div class="border-t border-blue-600/60 pt-1.5 space-y-1 text-xs">
                <div class="flex items-start gap-1">
                    <span class="text-yellow-300 font-bold">🌧 降雨預報:</span>
                    <span id="wx-rain-forecast" class="text-white font-bold">查詢中...</span>
                </div>
                <div class="flex items-start gap-1">
                    <span class="text-amber-300 font-bold">⚠️ 天氣警告:</span>
                    <span id="wx-warning" class="text-white">無特別警告</span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const STOP_ID = "30B726B18D6F2553";
        const ROUTES = ["26", "27", "29M", "42", "23"];

        // 1. Clock Implementation
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const dayName = days[now.getDay()];

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('clock-date').textContent = `${year}/${month}/${date} ${dayName}`;
            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Init Bus Layout
        function initBusCards() {
            const container = document.getElementById('bus-container');
            container.innerHTML = '';
            ROUTES.forEach(route => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center border-b border-gray-800 pb-2 pt-1";
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="bg-red-600 text-white font-bold px-3 py-1 rounded text-lg tracking-wider">🚌 ${route}</span>
                        <span id="dest-${route}" class="text-xs sm:text-sm text-gray-300 truncate max-w-[140px] sm:max-w-[220px]">往指定方向</span>
                    </div>
                    <div id="eta-${route}" class="text-right text-cyan-300 font-bold text-base sm:text-lg font-mono flex gap-2 items-center">
                        <span>-- min</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 3. Fetch KMB ETA (Showing next 2 buses with destination)
        async function fetchETAs() {
            try {
                const res = await fetch(`https://etabus.data.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}`);
                if (!res.ok) return;
                const data = await res.json();
                const list = data.data || [];

                ROUTES.forEach(route => {
                    const el = document.getElementById(`eta-${route}`);
                    const destEl = document.getElementById(`dest-${route}`);
                    if (!el || !destEl) return;

                    const routeEtas = list.filter(i => i.route === route);
                    if (routeEtas.length === 0) {
                        destEl.textContent = "暫無班次";
                        el.innerHTML = `<span class="text-gray-500 text-sm">HOLD</span>`;
                        return;
                    }

                    // 設定目的地（取第一班車的destination）
                    const firstItem = routeEtas[0];
                    destEl.textContent = `往 ${firstItem.dest_tc || ''}`;

                    // 取前 2 班車的倒數時間
                    const timesHtml = routeEtas.slice(0, 2).map(item => {
                        if (!item.eta) return `<span class="text-gray-400">${item.rmk_tc || 'HOLD'}</span>`;
                        const diff = Math.round((new Date(item.eta) - new Date()) / 60000);
                        if (diff <= 1) return `<span class="text-red-500 animate-blink">即到</span>`;
                        if (diff <= 3) return `<span class="text-red-400 font-bold animate-blink">${diff}m</span>`;
                        return `${diff}m`;
                    });

                    el.innerHTML = timesHtml.join(' <span class="text-gray-600 text-xs">|</span> ');
                });
            } catch (e) {
                console.error(e);
            }
        }

        // 4. Fetch Weather & Rain Forecast (HKO Open API)
        async function fetchWeather() {
            try {
                const resRpt = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                if (resRpt.ok) {
                    const data = await resRpt.json();
                    
                    if (data.temperature && data.temperature.data.length > 0) {
                        const kwunTong = data.temperature.data.find(t => t.place === '觀塘') || data.temperature.data[0];
                        document.getElementById('wx-temp').textContent = kwunTong.value;
                    }

                    if (data.humidity && data.humidity.data.length > 0) {
                        document.getElementById('wx-rh').textContent = `${data.humidity.data[0].value}%`;
                    }

                    if (data.uvindex && data.uvindex.data.length > 0) {
                        document.getElementById('wx-uv').textContent = data.uvindex.data[0].value;
                    } else {
                        document.getElementById('wx-uv').textContent = '0';
                    }

                    if (data.warningMessage && data.warningMessage.length > 0) {
                        document.getElementById('wx-warning').textContent = data.warningMessage.join(' | ');
                    } else {
                        document.getElementById('wx-warning').textContent = '現時無天氣警告';
                    }

                    const now = new Date();
                    document.getElementById('weather-time').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                }

                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                if (resFnd.ok) {
                    const fndData = await resFnd.json();
                    if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                        const todayFc = fndData.weatherForecast[0];
                        const psr = todayFc.PSR || '中';
                        const forecastText = todayFc.forecastWeather || '';

                        let rainMsg = "降雨概率: " + psr;
                        if (forecastText.includes('雨') || forecastText.includes('陣雨')) {
                            rainMsg += " (預測有局部/幾陣雨)";
                        } else {
                            rainMsg += " (預計無明顯降雨)";
                        }
                        document.getElementById('wx-rain-forecast').textContent = rainMsg;
                        document.getElementById('wx-icon-text').textContent = todayFc.forecastForecast || todayFc.forecastWeather;
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('wx-rain-forecast').textContent = "暫時未能取得";
            }
        }

        // 5. Run & Auto-Refresh
        initBusCards();
        fetchETAs();
        fetchWeather();

        setInterval(fetchETAs, 30000);
        setInterval(fetchWeather, 300000);
    </script>
</body>
</html>
