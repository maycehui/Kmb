<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>順利紀律部隊宿舍 - 巴士即時到站看板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['"SF Mono"', 'Consolas', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#0a0a0c] text-gray-100 h-screen w-screen overflow-hidden flex flex-col justify-between p-2 sm:p-4 selection:bg-blue-500 selection:text-white">

    <!-- Header (連同即時時鐘) -->
    <header class="w-full bg-[#141418] border border-gray-800 px-4 py-3 flex justify-between items-center shadow-lg rounded-xl shrink-0">
        <div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="connection-dot"></span>
                <h1 class="text-base sm:text-xl font-bold tracking-tight text-white">順利紀律部隊宿舍</h1>
            </div>
            <p class="text-[11px] sm:text-xs text-gray-400 mt-0.5">Stop ID: 30B726B18D6F2553</p>
        </div>
        <div class="text-right">
            <div id="clock-time" class="text-xl sm:text-2xl font-mono font-black text-white tracking-wider">00:00:00</div>
            <div id="clock-date" class="text-[10px] sm:text-xs text-gray-400">----/--/-- ---</div>
        </div>
    </header>

    <!-- Main Content: Route Cards Grid -->
    <main class="w-full max-w-7xl mx-auto my-2 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-4 overflow-y-auto" id="bus-main-container">
        <!-- 路線卡片將會透過 JS 動態載入 -->
    </main>

    <!-- Footer: 天文台即時天氣與觀塘區降雨預報 -->
    <footer class="w-full bg-[#141418] border border-gray-800 px-4 py-2.5 rounded-xl shadow-lg shrink-0 text-xs text-gray-300 space-y-1">
        <div class="flex justify-between items-center font-bold text-cyan-400 border-b border-gray-800 pb-1">
            <span>天文台即時氣象 & 觀塘區預報</span>
            <span id="weather-time" class="text-[10px] text-gray-400 font-normal">--:--</span>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-0.5">
            <div>氣溫: <span id="wx-temp" class="font-bold text-white">--</span>°C</div>
            <div>相對濕度: <span id="wx-rh" class="font-bold text-white">--%</span></div>
            <div>紫外線: <span id="wx-uv" class="font-bold text-white">--</span></div>
            <div class="truncate">天氣: <span id="wx-icon-text" class="font-bold text-white">載入中...</span></div>
        </div>
        <div class="border-t border-gray-800/60 pt-1 flex flex-col sm:flex-row justify-between gap-1 text-[11px]">
            <div>
                <span class="text-yellow-400 font-bold">🌧 觀塘區/本港降雨預報:</span> 
                <span id="wx-rain-forecast" class="text-gray-200">正在分析天文台數據...</span>
            </div>
            <div class="text-amber-300 truncate">
                <span class="font-bold">⚠️</span> <span id="wx-warning">無天氣警告</span>
            </div>
        </div>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        const STOP_ID = "30B726B18D6F2553";
        const ROUTES = ["26", "27", "29M", "42", "23"];

        // 路線專屬顏色配置
        const ROUTE_COLORS = {
            "26": "bg-amber-500/20 text-amber-400 border-amber-500/40",
            "27": "bg-blue-500/20 text-blue-400 border-blue-500/40",
            "29M": "bg-emerald-500/20 text-emerald-400 border-emerald-500/40",
            "42": "bg-purple-500/20 text-purple-400 border-purple-500/40",
            "23": "bg-rose-500/20 text-rose-400 border-rose-500/40"
        };

        // 1. Clock Implementation
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dayName = '星期' + days[now.getDay()];

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('clock-date').textContent = `${year}/${month}/${date} (${dayName})`;
            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function initCards() {
            const mainContainer = document.getElementById('bus-main-container');
            mainContainer.innerHTML = '';
            ROUTES.forEach(route => {
                const colorClass = ROUTE_COLORS[route] || "bg-gray-800 text-gray-300 border-gray-700";
                const div = document.createElement('div');
                div.className = "bg-[#141418] border border-gray-800/80 rounded-xl p-3 shadow-md flex flex-col justify-between";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="px-3 py-0.5 rounded-lg font-black text-base sm:text-lg border ${colorClass}">
                            ${route}
                        </span>
                        <span id="dest-${route}" class="text-xs text-gray-400 truncate max-w-[70%] text-right">往指定方向</span>
                    </div>
                    <div class="space-y-1.5" id="etas-${route}">
                        <div class="text-gray-500 text-xs py-1">載入即時資訊中...</div>
                    </div>
                `;
                mainContainer.appendChild(div);
            });
        }

        async function fetchETAs() {
            const dotEl = document.getElementById('connection-dot');
            try {
                const response = await fetch(`https://etabus.data.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}`);
                if (!response.ok) throw new Error('網絡連線錯誤');
                
                const data = await response.json();
                const etaList = data.data || [];

                ROUTES.forEach(route => {
                    const container = document.getElementById(`etas-${route}`);
                    const destEl = document.getElementById(`dest-${route}`);
                    if (!container || !destEl) return;

                    const routeEtas = etaList.filter(item => item.route === route);

                    if (routeEtas.length === 0) {
                        destEl.textContent = "暫無班次";
                        container.innerHTML = `<div class="text-gray-500 text-xs py-1">暫無預定班次</div>`;
                        return;
                    }

                    // 設定目的地
                    destEl.textContent = `往 ${routeEtas[0].dest_tc || ''}`;

                    let html = '';
                    // 取前 2 個班次
                    routeEtas.slice(0, 2).forEach((item) => {
                        let timeStr = "即將到達";
                        let isUrgent = false;

                        if (item.eta) {
                            const etaTime = new Date(item.eta);
                            const now = new Date();
                            const diffMinutes = Math.round((etaTime - now) / 60000);

                            if (diffMinutes <= 1) {
                                timeStr = "剛剛到";
                                isUrgent = true;
                            } else if (diffMinutes <= 3) {
                                timeStr = `${diffMinutes} 分鐘`;
                                isUrgent = true;
                            } else {
                                timeStr = `${diffMinutes} 分鐘`;
                            }
                        } else if (item.rmk_tc) {
                            timeStr = item.rmk_tc;
                        }
                        
                        html += `
                            <div class="flex justify-between items-center bg-[#1a1a20] px-3 py-1.5 rounded-lg border border-gray-800/50">
                                <span class="text-xs text-gray-300">班次</span>
                                <span class="font-mono font-bold text-sm sm:text-base ${isUrgent ? 'text-[#ff453a] animate-pulse-fast' : 'text-white'}">
                                    ${timeStr}
                                </span>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                });
                dotEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500";
            } catch (error) {
                console.error(error);
                dotEl.className = "inline-block w-2.5 h-2.5 rounded-full bg-red-500";
            }
        }

        // 4. Fetch Weather & Rain Forecast (HKO Open API)
        async function fetchWeather() {
            try {
                const resRpt = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                if (resRpt.ok) {
                    const data = await resRpt.json();
                    
                    if (data.temperature && data.temperature.data.length > 0) {
                        const kwunTong = data.temperature.data.find(t => t.place === '觀塘') || data.temperature.data[0];
                        document.getElementById('wx-temp').textContent = kwunTong.value;
                    }

                    if (data.humidity && data.humidity.data.length > 0) {
                        document.getElementById('wx-rh').textContent = `${data.humidity.data[0].value}%`;
                    }

                    if (data.uvindex && data.uvindex.data.length > 0) {
                        document.getElementById('wx-uv').textContent = data.uvindex.data[0].value;
                    } else {
                        document.getElementById('wx-uv').textContent = '0';
                    }

                    if (data.warningMessage && data.warningMessage.length > 0) {
                        document.getElementById('wx-warning').textContent = data.warningMessage.join(' | ');
                    } else {
                        document.getElementById('wx-warning').textContent = '無天氣警告';
                    }

                    const now = new Date();
                    document.getElementById('weather-time').textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                }

                // 取得分區或九天預報中的降雨資訊
                const resFnd = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                if (resFnd.ok) {
                    const fndData = await resFnd.json();
                    if (fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                        const todayFc = fndData.weatherForecast[0];
                        const psr = todayFc.PSR || '中';
                        const forecastText = todayFc.forecastWeather || '';
                        
                        let rainDesc = `显著降雨概率: ${psr}`;
                        if (forecastText.includes('雨') || forecastText.includes('陣雨') || forecastText.includes('雷')) {
                            rainDesc += ` (今日預測有雨/陣雨，外出請備傘)`;
                        } else {
                            rainDesc += ` (今日暫無明顯持續降雨)`;
                        }
                        document.getElementById('wx-rain-forecast').textContent = rainDesc;
                        document.getElementById('wx-icon-text').textContent = todayFc.forecastForecast || forecastText;
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('wx-rain-forecast').textContent = "未能取得天文台預報";
            }
        }

        // 初始化
        initCards();
        fetchETAs();
        fetchWeather();

        // 30秒更新巴士，5分鐘更新天氣
        setInterval(fetchETAs, 30000);
        setInterval(fetchWeather, 300000);
    </script>
</body>
</html>
